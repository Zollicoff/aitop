[package]
name = "aitop"
version = "2.4.0"
edition = "2021"
rust-version = "1.86"
description = "A btop-style terminal dashboard for AI coding tool usage: Claude Code, Codex CLI and the agents T3 Code runs"
license = "Apache-2.0"
repository = "https://github.com/Zollicoff/aitop"
readme = "README.md"
keywords = ["tui", "claude", "codex", "usage", "t3code"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
gethostname = "1"
iana-time-zone = "0.1.65"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = "0.9"
toml_edit = "0.25"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
ureq = "3"
zstd = { version = "0.14.4", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
